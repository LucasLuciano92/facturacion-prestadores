name: Validar procesador

on:
  push:
    branches: [main, 'feature/**', 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Sintaxis estilo y pruebas Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt ruff==0.14.1
      - name: Comprobar sintaxis
        run: python -m compileall -q procesador.py prestadores.py validaciones.py liquidacion.py liquidacion_refactor.py medir_complejidad.py tests
      - name: Comprobar estilo y errores estáticos
        run: ruff check .
      - name: Ejecutar pruebas unitarias integración y regresión
        run: python -m unittest discover -s tests -v

  paquete:
    name: Empaquetado y ensayo
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - name: Instalar el paquete en un entorno limpio
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ensayo"
          "$RUNNER_TEMP/ensayo/bin/python" -m pip install dist/*.whl
      - name: Procesar la muestra desde fuera del checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ensayo/bin/procesar-facturacion" \
            --clinica "$GITHUB_WORKSPACE/datos/clinica.xlsx" \
            --afiliados "$GITHUB_WORKSPACE/datos/afiliados.json" \
            --fecha 2026-10-15 --salida "$RUNNER_TEMP/salida"
          "$RUNNER_TEMP/ensayo/bin/python" - <<'PY'
          import csv
          import json
          from pathlib import Path
          resumen = json.loads(Path('salida/resumen.json').read_text())
          assert resumen == {'recibidos': 5, 'aceptados': 1, 'rechazados': 4}
          with Path('salida/liquidacion.csv').open(newline='') as f:
              filas = list(csv.DictReader(f, delimiter=';'))
          assert len(filas) == 1 and filas[0]['importe'] == '12500.00'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-verificado
          path: dist/
          retention-days: 14
